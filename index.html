<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Poppy 🎈</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <main class="app">

        <div
            id="poppy"
            class="poppy"
        >
            🎈
        </div>

        <h1>Poppy</h1>

        <p
            id="status"
            class="status"
        >
            Ready!
        </p>

        <div
            id="conversation"
            class="conversation"
        >
            Press Talk to meet Poppy!
        </div>

        <div class="controls">

            <button
                id="talk"
            >
                🎤 Talk to Poppy
            </button>

            <button
                id="stop"
                disabled
            >
                ⛔ Stop
            </button>

        </div>

        <div
            id="error"
            class="error"
            hidden
        ></div>

    </main>

    <script src="app.js"></script>

</body>

</html>
